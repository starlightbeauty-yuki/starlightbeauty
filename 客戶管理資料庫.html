<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarLight Beauty · 客戶管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdfaf6;
  --card: #ffffff;
  --text: #3d3535;
  --sub: #8c7b74;
  --rose: #d4948a;
  --rose-light: #fdf2f3;
  --gold: #c4a97d;
  --gold-light: #faf6ef;
  --green: #6bae7c;
  --green-light: #f0f7f2;
  --line: #eae3db;
  --store-tm: #4caf50;
  --store-tm-bg: #e8f5e9;
  --store-lkc: #42a5f5;
  --store-lkc-bg: #e3f2fd;
  --store-tc: #ab47bc;
  --store-tc-bg: #f3e5f5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans HK","Microsoft JhengHei","PingFang HK",sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  min-height: 100vh; display: flex; flex-direction: column;
}

/* Header */
.header {
  background: var(--card); padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,0.04);
}
.header h1 { font-size: 1.15em; color: #4a3f3a; font-weight: 700; font-family: 'Alex Brush', cursive; }
.header .actions { display: flex; gap: 8px; }
.header button {
  border: none; padding: 8px 16px; border-radius: 10px;
  font-size: 0.8em; font-weight: 600; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.header button:hover { transform: translateY(-1px); }
.btn-primary { background: var(--rose); color: #fff; }
.btn-secondary { background: var(--gold-light); color: #6b5a3e; }
.btn-danger { background: #fdf2f3; color: #c0392b; }
.btn-green { background: var(--green); color: #fff; }

/* Main */
.main { display: flex; flex: 1; }
.sidebar {
  width: 280px; background: var(--card); border-right: 1px solid var(--line);
  padding: 12px; overflow-y: auto; flex-shrink: 0;
}
.content { flex: 1; padding: 20px; overflow-y: auto; }

/* Stats bar */
.stats-bar {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
}
.stat-card {
  flex: 1; min-width: 140px; background: var(--card);
  border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  text-align: center;
}
.stat-card .stat-num { font-size: 1.8em; font-weight: 800; color: var(--rose); }
.stat-card .stat-label { font-size: 0.75em; color: var(--sub); margin-top: 2px; }

/* Search */
.search-box {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--line);
  border-radius: 12px; font-size: 0.88em; margin-bottom: 12px;
  outline: none; transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--rose); }

/* Client list */
.client-list { display: flex; flex-direction: column; gap: 4px; }
.client-item {
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  transition: background 0.15s; font-size: 0.86em;
  display: flex; align-items: center; gap: 10px;
}
.client-item:hover { background: var(--bg); }
.client-item.active { background: var(--rose-light); }
.client-item .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gold-light); display: flex;
  align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.9em; color: var(--gold); flex-shrink: 0;
}
.client-item .info { flex: 1; min-width: 0; }
.client-item .name { font-weight: 600; color: #4a3f3a; }
.client-item .phone { font-size: 0.78em; color: var(--sub); }
.client-item .tag-row { display: flex; gap: 4px; margin-top: 3px; }
.tag {
  font-size: 0.65em; padding: 1px 7px; border-radius: 8px;
  font-weight: 600; white-space: nowrap;
}
.tag-new { background: #e3f2fd; color: #1565c0; }
.tag-active { background: #e8f5e9; color: #2e7d32; }
.tag-vip { background: #fff3e0; color: #e65100; }
.tag-cold { background: #f5f5f5; color: #9e9e9e; }
.tag-199 { background: #fce4ec; color: #c62828; }
.tag-ab { background: #f3e5f5; color: #6a1b9a; }
.tag-store-tm { background: var(--store-tm-bg); color: var(--store-tm); font-weight: 600; }
.tag-store-lkc { background: var(--store-lkc-bg); color: var(--store-lkc); font-weight: 600; }
.tag-store-tc { background: var(--store-tc-bg); color: var(--store-tc); font-weight: 600; }

/* Store checkbox group */
.store-checkbox-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.store-checkbox-group label {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.85em; cursor: pointer; padding: 4px 10px;
  border-radius: 8px; border: 1.5px solid var(--line);
  transition: border-color 0.15s, background 0.15s;
}
.store-checkbox-group label:has(input:checked) {
  background: var(--rose-light); border-color: var(--rose);
}
.store-checkbox-group input[type="checkbox"] { accent-color: var(--rose); }

/* Sidebar store filter buttons */
.store-filter-btn {
  font-size: 0.68em; padding: 3px 8px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--card);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.store-filter-btn.active { background: var(--rose); color: #fff; border-color: var(--rose); }

/* Detail panel */
.client-detail { background: var(--card); border-radius: 16px; padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
.detail-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.detail-header .big-avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--gold-light); display: flex;
  align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.3em; color: var(--gold);
}
.detail-header h2 { font-size: 1.2em; }
.detail-header .phone { font-size: 0.82em; color: var(--sub); }
.detail-header .status-select {
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 5px 10px; font-size: 0.78em; outline: none;
  margin-top: 4px;
}

.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.detail-field label { display: block; font-size: 0.72em; color: var(--sub); margin-bottom: 2px; }
.detail-field input, .detail-field select, .detail-field textarea {
  width: 100%; padding: 8px 12px; border: 1.5px solid var(--line);
  border-radius: 10px; font-size: 0.85em; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.detail-field input:focus, .detail-field select:focus { border-color: var(--rose); }
.detail-field textarea { resize: vertical; min-height: 60px; }
.detail-field textarea:focus { border-color: var(--rose); }

/* Visit history */
.visit-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.visit-table th {
  text-align: left; font-size: 0.72em; color: var(--sub);
  padding: 8px 10px; border-bottom: 1.5px solid var(--line);
  font-weight: 600;
}
.visit-table td {
  padding: 8px 10px; font-size: 0.82em;
  border-bottom: 1px solid var(--line); color: #555;
}
.visit-table tr:last-child td { border-bottom: none; }

.empty-state {
  text-align: center; padding: 60px 20px; color: var(--sub);
}
.empty-state .icon { font-size: 3em; margin-bottom: 12px; }
.empty-state p { font-size: 0.9em; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px; padding: 24px;
  max-width: 440px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}
.modal h3 { margin-bottom: 16px; font-size: 1.05em; }
.modal .form-row { margin-bottom: 12px; }
.modal .form-row label { display: block; font-size: 0.8em; color: var(--sub); margin-bottom: 4px; }
.modal .form-row input, .modal .form-row select {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--line);
  border-radius: 10px; font-size: 0.88em; outline: none;
}
.modal .form-row input:focus, .modal .form-row select:focus { border-color: var(--rose); }
.modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

/* Mobile */
@media (max-width: 768px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
  .content { padding: 14px; }
  .detail-grid { grid-template-columns: 1fr; }
  .stats-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>✨ StarLight Beauty · 客戶管理</h1>
  <div class="actions">
    <button class="btn-danger" onclick="exportBackup()" title="下載備份檔案到電腦">💾 備份</button>
    <button class="btn-secondary" onclick="document.getElementById('importFileInput').click()" title="從備份檔案還原">📥 還原</button>
    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importBackup(this)">
    <button class="btn-secondary" onclick="exportCSV()">📥 匯出 CSV</button>
    <button class="btn-green" onclick="showAddVisitModal()">📝 加入來訪記錄</button>
    <button class="btn-primary" onclick="showAddClientModal()">＋ 新增客戶</button>
  </div>
</div>

<!-- ⚠️ Storage warning banner -->
<div id="storageWarning" style="display:none;background:#fff3cd;color:#856404;text-align:center;padding:8px 12px;font-size:0.8em;font-weight:600;border-bottom:2px solid #ffc107;">
  ⚠️ 瀏覽器儲存不可用！資料只喺記憶體，關閉頁面會全部消失。請定時撳 <b>💾 備份</b>！
</div>

<!-- Main content -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <input type="text" class="search-box" placeholder="🔍 搜尋客戶名稱或電話..." oninput="renderClientList()" id="searchInput">
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn-secondary" style="font-size:0.7em;padding:4px 10px;" onclick="filterTag='all';renderClientList();renderStats();">全部</button>
      <button class="store-filter-btn" style="font-size:0.7em;padding:4px 10px;" onclick="storeFilter='';renderClientList();">全部分店</button>
      <button class="store-filter-btn" style="font-size:0.7em;padding:4px 10px;" onclick="storeFilter='屯門';renderClientList();">🟢 屯門</button>
      <button class="store-filter-btn" style="font-size:0.7em;padding:4px 10px;" onclick="storeFilter='荔枝角';renderClientList();">🔵 荔枝角</button>
      <button class="store-filter-btn" style="font-size:0.7em;padding:4px 10px;" onclick="storeFilter='太子';renderClientList();">🟣 太子</button>
      <button class="btn-secondary" style="font-size:0.7em;padding:4px 10px;" onclick="filterTag='active';renderClientList();renderStats();">🟢 活躍客</button>
      <button class="btn-secondary" style="font-size:0.7em;padding:4px 10px;" onclick="filterTag='new';renderClientList();renderStats();">🔵 新客</button>
      <button class="btn-secondary" style="font-size:0.7em;padding:4px 10px;" onclick="filterTag='199';renderClientList();renderStats();">🏷 $199客</button>
      <button class="btn-secondary" style="font-size:0.7em;padding:4px 10px;" onclick="filterTag='ab';renderClientList();renderStats();">🏷 A+B客</button>
    </div>
    <div class="client-list" id="clientList">
      <div class="empty-state"><div class="icon">📋</div><p>未有客戶記錄<br>按「＋ 新增客戶」開始</p></div>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="contentArea">
    <div id="statsRow" class="stats-bar"></div>
    <div id="detailPanel" class="empty-state">
      <div class="icon">👈</div>
      <p>喺左邊揀一個客戶<br>或按＋新增客戶</p>
    </div>
  </div>
</div>

<!-- Add Client Modal -->
<div class="modal-overlay" id="addClientModal">
  <div class="modal">
    <h3>➕ 新增客戶</h3>
    <div class="form-row">
      <label>客戶名稱</label>
      <input type="text" id="newClientName" placeholder="例如：陳小姐（可留空）">
    </div>
    <div class="form-row">
      <label>客戶編號（SL ID）</label>
      <input type="text" id="newClientSlId" placeholder="例如：SL-0057（已到店客戶先填）">
    </div>
    <div class="form-row">
      <label>WhatsApp / 電話</label>
      <input type="text" id="newClientPhone" placeholder="例如：9123 4567 或 +852 9123 4567">
    </div>
    <div class="form-row">
      <label>FB / IG 帳戶</label>
      <input type="text" id="newClientFbIg" placeholder="例如：fb.com/username 或 IG @username">
    </div>
    <div class="form-row">
      <label>來源渠道</label>
      <select id="newClientSource">
        <option value="">－請選擇－</option>
        <option value="FB廣告">Facebook 廣告</option>
        <option value="IG廣告">Instagram 廣告</option>
        <option value="IG_post">IG 帖子</option>
        <option value="FB_post">Facebook 帖子</option>
        <option value="朋友介紹">朋友介紹</option>
        <option value="WhatsApp廣播">WhatsApp 廣播</option>
        <option value="路過">路過/樓上</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-row">
      <label>客戶狀態</label>
      <select id="newClientStatus">
        <option value="new">🔵 新客（未到店）</option>
        <option value="active">🟢 活躍客（已到店）</option>
        <option value="vip">🟠 VIP 熟客</option>
        <option value="cold">⚪ 沉睡客</option>
      </select>
    </div>
    <div class="form-row">
      <label>常去分店（可多選）</label>
      <div class="store-checkbox-group" id="newClientStores">
        <label><input type="checkbox" value="屯門"> 🟢 屯門</label>
        <label><input type="checkbox" value="荔枝角"> 🔵 荔枝角</label>
        <label><input type="checkbox" value="太子"> 🟣 太子</label>
      </div>
    </div>
    <div class="form-row">
      <label>備註</label>
      <input type="text" id="newClientNote" placeholder="例如：對膠原療程有興趣">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideAddClientModal()">取消</button>
      <button class="btn-primary" onclick="addClient()">✓ 新增</button>
    </div>
  </div>
</div>

<!-- Add Visit Modal -->
<div class="modal-overlay" id="addVisitModal">
  <div class="modal">
    <h3>📝 紀錄來訪</h3>
    <div class="form-row">
      <label>客戶 *</label>
      <select id="visitClientSelect"></select>
    </div>
    <div class="form-row">
      <label>療程項目</label>
      <select id="visitService">
        <option value="">－請選擇－</option>
        <option value="新客$199 / $299 FACIAL 優惠">新客$199 / $299 FACIAL 優惠</option>
        <option value="香薰 FACIAL 優惠">香薰 FACIAL 優惠</option>
        <option value="髗骶睡眠頭療">髗骶睡眠頭療</option>
        <option value="采耳">采耳</option>
        <option value="生活美容">生活美容</option>
        <option value="身體療程">身體療程</option>
        <option value="美睫">美睫</option>
        <option value="半永久飄霧眉">半永久飄霧眉</option>
        <option value="化妝">化妝</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-row">
      <label>本次分店</label>
      <select id="visitStore">
        <option value="">－請選擇－</option>
        <option value="屯門">🟢 屯門</option>
        <option value="荔枝角">🔵 荔枝角</option>
        <option value="太子">🟣 太子</option>
      </select>
    </div>
    <div class="form-row">
      <label>收費</label>
      <input type="number" id="visitPrice" placeholder="例如：199">
    </div>
    <div class="form-row">
      <label>來訪日期</label>
      <input type="date" id="visitDate">
    </div>
    <div class="form-row">
      <label>備註</label>
      <input type="text" id="visitNote" placeholder="例如：皮膚較乾，建議下次做保濕">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="hideAddVisitModal()">取消</button>
      <button class="btn-primary" onclick="addVisit()">✓ 紀錄</button>
    </div>
  </div>
</div>

function saveData() {
  markDirty();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
    renderAll();
    showToast('✅ 已儲存', 'success');
    isDirty = false;
  } catch(e) {
    console.error('❌ 儲存失敗：' + e.message);
    try { renderAll(); } catch(e2) {}
    if (!storageAvailable) {
      showToast('⚠️ 瀏覽器無法儲存！請撳 💾 備份 下載到電腦', 'error');
    } else {
      showToast('⚠️ 儲存失敗: ' + e.message, 'error');
    }
  }
}

// --- Toast notification ---
function showToast(msg, type) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = 'position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:0.85em;font-weight:600;z-index:9999;animation:toastIn 0.3s ease;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,0.15);pointer-events:none;';
    document.body.appendChild(toast);
    // Add keyframes dynamically
    if (!document.getElementById('toast-style')) {
      const style = document.createElement('style');
      style.id = 'toast-style';
      style.textContent = '@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}';
      document.head.appendChild(style);
    }
  }
  toast.textContent = msg;
  if (type === 'error') {
    toast.style.background = '#fff0f0'; toast.style.color = '#c0392b'; toast.style.border = '1.5px solid #f5c6cb';
  } else if (type === 'warn') {
    toast.style.background = '#fff8e1'; toast.style.color = '#f57f17'; toast.style.border = '1.5px solid #ffecb3';
  } else {
    toast.style.background = '#f0fff0'; toast.style.color = '#2e7d32'; toast.style.border = '1.5px solid #c3e6cb';
  }
  toast.style.display = 'block';
  setTimeout(function(){ toast.style.display = 'none'; }, 5000);
}

function genId() { return 'c' + Date.now() + Math.random().toString(36).slice(2,6); }

// --- Client CRUD ---

function addClient() {
  const name = document.getElementById('newClientName').value.trim();
  const slId = document.getElementById('newClientSlId').value.trim();

  // Read store checkboxes
  const storeCheckboxes = document.querySelectorAll('#newClientStores input[type="checkbox"]');
  const stores = Array.from(storeCheckboxes).filter(cb => cb.checked).map(cb => cb.value);

  clients.push({
    id: genId(),
    slId: slId || null,
    name: name,
    phone: document.getElementById('newClientPhone').value.trim(),
    fbIg: document.getElementById('newClientFbIg').value.trim(),
    stores: stores,
    source: document.getElementById('newClientSource').value,
    status: document.getElementById('newClientStatus').value || 'new',
    note: document.getElementById('newClientNote').value.trim(),
    hasUsed199: false,
    hasUsedAB: false,
    visits: [],
    createdAt: new Date().toISOString()
  });
  hideAddClientModal();
  saveData();
}

function updateClientField(clientId, field, value) {
  const c = clients.find(x => String(x.id) === String(clientId));
  if (!c) return;
  c[field] = value;
  if (field === 'status') { saveData(); return; }
  saveData();
}

function deleteClient(clientId) {
  if (!confirm('確定要刪除呢位客戶？此操作不可恢復。')) return;
  clients = clients.filter(x => x.id !== clientId);
  if (selectedClientId === clientId) selectedClientId = null;
  saveData();
}

function updateClientStores(clientId) {
  const c = clients.find(x => String(x.id) === String(clientId));
  if (!c) return;
  const checkboxes = document.querySelectorAll('#detailStoreGroup input[type="checkbox"]');
  c.stores = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
  saveData();
}

// --- Visit ---
function addVisit() {
  try {
  const clientId = document.getElementById('visitClientSelect').value;
  if (!clientId) { alert('請選擇客戶'); return; }
  const c = clients.find(x => String(x.id) === String(clientId));
  if (!c) { alert('找不到客戶資料，請重新整理頁面'); return; }
  const service = document.getElementById('visitService').value;
  const price = document.getElementById('visitPrice').value;
  const date = document.getElementById('visitDate').value || new Date().toISOString().slice(0,10);
  const store = document.getElementById('visitStore').value;
  const note = document.getElementById('visitNote').value.trim();

  // Ensure visits array exists
  if (!Array.isArray(c.visits)) c.visits = [];

  c.visits.push({ date, service, price: price ? parseInt(price) : null, store: store || null, note, id: genId() });

  // Auto-detect tags
  if (service === '新客$199 / $299 FACIAL 優惠') c.hasUsed199 = true;
  // A+B 標籤（HM 膠原喚醒等）由小主手動勾選，不自動偵測
  if (c.status === 'new') c.status = 'active';

  hideAddVisitModal();
  saveData();
  } catch(e) {
    console.error('addVisit error:', e.message, e.stack);
    alert('⚠️ 記錄失敗：' + e.message + '\n請嘗試重新整理頁面後再試。');
  }
}

function deleteVisit(clientId, visitId) {
  const c = clients.find(x => String(x.id) === String(clientId));
  if (!c) return;
  if (!confirm('刪除呢條來訪記錄？')) return;
  c.visits = c.visits.filter(v => v.id !== visitId);
  saveData();
}

// --- Modals ---
function showAddClientModal() {
  document.getElementById('addClientModal').classList.add('show');
  document.getElementById('newClientName').focus();
}
function hideAddClientModal() {
  document.getElementById('addClientModal').classList.remove('show');
  document.getElementById('newClientName').value = '';
  document.getElementById('newClientSlId').value = '';
  document.getElementById('newClientPhone').value = '';
  document.getElementById('newClientFbIg').value = '';
  document.getElementById('newClientSource').value = '';
  document.getElementById('newClientStatus').value = 'new';
  document.getElementById('newClientNote').value = '';
  // Reset store checkboxes
  document.querySelectorAll('#newClientStores input[type="checkbox"]').forEach(cb => cb.checked = false);
}

function showAddVisitModal() {
  const sel = document.getElementById('visitClientSelect');
  sel.innerHTML = '<option value="">－請選擇客戶－</option>';
  clients.forEach(c => {
    sel.innerHTML += `<option value="${c.id}" ${String(c.id)===String(selectedClientId)?'selected':''}>${c.name} ${c.phone ? '('+c.phone+')' : ''}</option>`;
  });
  document.getElementById('visitDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('visitPrice').value = '';
  document.getElementById('visitNote').value = '';
  document.getElementById('visitService').value = '';
  document.getElementById('visitStore').value = '';
  // Auto-select store based on client's stores
  if (selectedClientId) {
    const c = clients.find(x => String(x.id) === String(selectedClientId));
    if (c && c.stores && c.stores.length === 1) {
      document.getElementById('visitStore').value = c.stores[0];
    }
  }
  document.getElementById('addVisitModal').classList.add('show');
}
function hideAddVisitModal() {
  document.getElementById('addVisitModal').classList.remove('show');
}

// --- Render ---
function normPhone(p) {
  return (p||'').replace(/[\s\-()]/g,'').replace(/^\+852/,'');
}
function getFilteredClients() {
  const rawSearch = (document.getElementById('searchInput')?.value || '');
  const search = rawSearch.toLowerCase();
  const searchNorm = normPhone(rawSearch);
  let filtered = clients;
  if (filterTag === 'active') filtered = filtered.filter(c => c.status === 'active' || c.status === 'vip');
  if (filterTag === 'new') filtered = filtered.filter(c => c.status === 'new');
  if (filterTag === 'vip') filtered = filtered.filter(c => c.status === 'vip');
  if (filterTag === 'cold') filtered = filtered.filter(c => c.status === 'cold');
  if (filterTag === '199') filtered = filtered.filter(c => c.hasUsed199);
  if (filterTag === 'ab') filtered = filtered.filter(c => c.hasUsedAB);
  // Store filter
  if (storeFilter) filtered = filtered.filter(c => (c.stores||[]).includes(storeFilter));
  if (search) filtered = filtered.filter(c => {
    if (c.name.toLowerCase().includes(search)) return true;
    if ((c.slId||'').toLowerCase().includes(search)) return true;
    if ((c.phone||'').includes(rawSearch)) return true;
    if (searchNorm && normPhone(c.phone).includes(searchNorm)) return true;
    return false;
  });
  return filtered.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function renderClientList() {
  const list = document.getElementById('clientList');
  const filtered = getFilteredClients();
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>沒有符合嘅客戶</p></div>';
    return;
  }
  list.innerHTML = filtered.map(c => {
    const statusTag = { 'new':'🔵','active':'🟢','vip':'🟠','cold':'⚪' }[c.status] || '';
    const initial = c.name ? c.name.charAt(0) : '👤';
    // Store tags
    const storeTags = (c.stores||[]).map(s => {
      if (s==='屯門') return '<span class="tag tag-store-tm">🟢屯門</span>';
      if (s==='荔枝角') return '<span class="tag tag-store-lkc">🔵荔枝角</span>';
      if (s==='太子') return '<span class="tag tag-store-tc">🟣太子</span>';
      return '';
    }).join('');
    return `<div class="client-item ${String(c.id)===String(selectedClientId)?'active':''}" onclick="selectClient('${c.id}')">
      <div class="avatar">${initial}</div>
      <div class="info">
        <div class="name">${statusTag} ${c.slId ? '<span style="color:var(--gold);font-weight:700;font-size:0.85em;">['+c.slId+']</span> ' : ''}${c.name||'<span style="color:var(--sub);font-style:italic;">未命名</span>'}</div>
        <div class="phone">${c.phone||'無電話'}${c.fbIg ? ' · ' + c.fbIg : ''}</div>
        <div class="tag-row">
          ${storeTags}
          ${c.hasUsed199 ? '<span class="tag tag-199">$199</span>' : ''}
          ${c.hasUsedAB ? '<span class="tag tag-ab">A+B</span>' : ''}
          ${c.visits?.length ? `<span class="tag tag-active">來訪${c.visits.length}次</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderStats() {
  const total = clients.length;
  const active = clients.filter(c => c.status === 'active' || c.status === 'vip').length;
  const used199 = clients.filter(c => c.hasUsed199).length;
  const usedAB = clients.filter(c => c.hasUsedAB).length;
  const totalVisits = clients.reduce((sum,c) => sum + (c.visits?.length||0), 0);
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">總客戶</div></div>
    <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">🟢 活躍客</div></div>
    <div class="stat-card"><div class="stat-num">${used199}</div><div class="stat-label">🏷 $199 客</div></div>
    <div class="stat-card"><div class="stat-num">${usedAB}</div><div class="stat-label">🏷 A+B 客</div></div>
    <div class="stat-card"><div class="stat-num">${totalVisits}</div><div class="stat-label">總來訪次數</div></div>
  `;
}

function selectClient(clientId) {
  selectedClientId = clientId;
  renderAll();
}

function renderDetail() {
  if (!selectedClientId) return;
  const c = clients.find(x => String(x.id) === String(selectedClientId));
  if (!c) { selectedClientId = null; renderAll(); return; }

  const statusTag = { 'new':'🔵 新客','active':'🟢 活躍客','vip':'🟠 VIP熟客','cold':'⚪ 沉睡客' };
  const visits = (c.visits||[]).sort((a,b) => b.date.localeCompare(a.date));
  const visitRows = visits.length ? visits.map(v => `
    <tr>
      <td>${v.date}</td>
      <td style="font-size:0.8em;">${v.store ? '<span style="font-weight:600;">' + v.store + '</span>' : '-'}</td>
      <td>${v.service||'未記錄'}</td>
      <td>${v.price ? '$'+v.price : '-'}</td>
      <td>${v.note||'-'}</td>
      <td><button class="btn-danger" style="font-size:0.65em;padding:2px 6px;" onclick="deleteVisit('${c.id}','${v.id}')">刪</button></td>
    </tr>
  `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--sub);padding:20px;">未有來訪記錄</td></tr>';

  document.getElementById('detailPanel').innerHTML = `
    <div class="client-detail">
      <div class="detail-header">
        <div class="big-avatar">${c.name ? c.name.charAt(0) : '👤'}</div>
        <div style="flex:1;">
          <input type="text" value="${c.name||''}" placeholder="未命名客戶" onchange="updateClientField('${c.id}','name',this.value)" style="font-size:1.2em;font-weight:700;border:none;border-bottom:2px solid transparent;padding:4px 0;background:transparent;width:100%;outline:none;font-family:inherit;color:#4a3f3a;" onfocus="this.style.borderBottomColor='var(--rose)'" onblur="this.style.borderBottomColor='transparent'">
          <div class="phone">${c.phone||'無電話'}</div>
          <select class="status-select" onchange="updateClientField('${c.id}','status',this.value)">
            ${Object.entries(statusTag).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div>
          <button class="btn-secondary" style="font-size:0.75em;" onclick="showAddVisitModal()">📝 加記錄</button>
          <button class="btn-danger" style="font-size:0.75em;" onclick="deleteClient('${c.id}')">🗑 刪除</button>
        </div>
      </div>

      <div class="detail-grid">
        <div class="detail-field">
          <label>客戶編號（SL ID）</label>
          <input type="text" value="${c.slId||''}" onchange="updateClientField('${c.id}','slId',this.value)" placeholder="例如：SL-0057">
        </div>
        <div class="detail-field">
          <label>常去分店（可多選）</label>
          <div class="store-checkbox-group" id="detailStoreGroup">
            <label><input type="checkbox" value="屯門" ${(c.stores||[]).includes('屯門')?'checked':''} onchange="updateClientStores('${c.id}')"> 🟢 屯門</label>
            <label><input type="checkbox" value="荔枝角" ${(c.stores||[]).includes('荔枝角')?'checked':''} onchange="updateClientStores('${c.id}')"> 🔵 荔枝角</label>
            <label><input type="checkbox" value="太子" ${(c.stores||[]).includes('太子')?'checked':''} onchange="updateClientStores('${c.id}')"> 🟣 太子</label>
          </div>
        </div>
        <div class="detail-field">
          <label>來源渠道</label>
          <select onchange="updateClientField('${c.id}','source',this.value)">
            <option value="">－未選擇－</option>
            ${['FB廣告','IG廣告','IG_post','FB_post','朋友介紹','WhatsApp廣播','路過','其他'].map(s=>`<option value="${s}" ${c.source===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="detail-field">
          <label>備註</label>
          <input type="text" value="${c.note||''}" onchange="updateClientField('${c.id}','note',this.value)">
        </div>
        <div class="detail-field">
          <label>WhatsApp 電話</label>
          <input type="text" value="${c.phone||''}" onchange="updateClientField('${c.id}','phone',this.value)">
        </div>
        <div class="detail-field">
          <label>FB / IG 帳戶</label>
          <input type="text" value="${c.fbIg||''}" onchange="updateClientField('${c.id}','fbIg',this.value)" placeholder="例如：fb.com/xxx 或 IG @xxx">
        </div>
        <div class="detail-field">
          <label>建立日期</label>
          <input type="text" value="${new Date(c.createdAt).toLocaleDateString('zh-HK')}" readonly style="color:var(--sub);">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <label style="font-size:0.78em;display:flex;align-items:center;gap:4px;cursor:pointer;" onclick="toggleTag('${c.id}','hasUsed199')">
          <input type="checkbox" ${c.hasUsed199?'checked':''} style="accent-color:var(--rose);"> 已使用 $199
        </label>
        <label style="font-size:0.78em;display:flex;align-items:center;gap:4px;cursor:pointer;" onclick="toggleTag('${c.id}','hasUsedAB')">
          <input type="checkbox" ${c.hasUsedAB?'checked':''} style="accent-color:#6a1b9a;"> 已使用 A+B
        </label>
      </div>

      <h4 style="font-size:0.9em;margin-bottom:8px;">📋 來訪歷史</h4>
      <table class="visit-table">
        <thead><tr><th>日期</th><th>分店</th><th>療程</th><th>收費</th><th>備註</th><th></th></tr></thead>
        <tbody>${visitRows}</tbody>
      </table>
    </div>
  `;
}

function toggleTag(clientId, field) {
  const c = clients.find(x => String(x.id) === String(clientId));
  if (!c) return;
  c[field] = !c[field];
  saveData();
}

function renderAll() {
  renderStats();
  renderClientList();
  renderDetail();
}

// --- Export CSV ---
function exportCSV() {
  let csv = '\uFEFF名稱,客戶編號,電話,FB/IG,狀態,常去分店,來源,備註,已用$199,已用A+B,建立日期,來訪次數,最後來訪\n';
  clients.forEach(c => {
    const lastVisit = c.visits?.length ? c.visits.sort((a,b)=>b.date.localeCompare(a.date))[0].date : '';
    const storesStr = (c.stores||[]).join('、');
    csv += '"'+c.name+'","'+c.slId+'","'+(c.phone||'')+'","'+(c.fbIg||'')+'","'+c.status+'","'+storesStr+'","'+(c.source||'')+'","'+(c.note||'')+'","'+(c.hasUsed199?'是':'否')+'","'+(c.hasUsedAB?'是':'否')+'","'+new Date(c.createdAt).toLocaleDateString('zh-HK')+'","'+(c.visits?.length||0)+'","'+lastVisit+'"\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'StarLight_客戶名單_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// --- Backup / Restore ---
function exportBackup() {
  const data = JSON.stringify(clients, null, 2);
  const blob = new Blob([data], {type:'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','');
  a.href = url; a.download = 'StarLight_備份_' + ts + '.json';
  a.click();
  URL.revokeObjectURL(url);
  isDirty = false;
  showToast('✅ 備份已下載！共 ' + clients.length + ' 位客戶', 'success');
}

function importBackup(input) {
  if (!confirm('⚠️ 確定要還原備份？\n而家嘅資料將會被覆蓋！\n\n強烈建議先撳「💾 備份」保留現有資料。')) {
    input.value = ''; return;
  }
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式錯誤：唔係客戶列表');
      clients = data;
      selectedClientId = null;
      saveData();
      showToast('✅ 已還原 ' + clients.length + ' 位客戶', 'success');
    } catch(err) {
      alert('❌ 還原失敗：' + err.message + '\n請確認揀咗正確嘅備份檔案。');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// --- Init ---
renderAll();
</script>
