<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #fdfaf6;
  --card: #ffffff;
  --text: #3d3535;
  --sub: #8c7b74;
  --rose: #d4948a;
  --rose-dark: #c07a70;
  --rose-light: #fdf2f3;
  --gold: #c4a97d;
  --gold-light: #faf6ef;
  --green: #8fa88a;
  --green-light: #f4f8f2;
  --blue: #6a9dc7;
  --blue-light: #eef5fb;
  --line: #e8e0d8;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: "Noto Sans HK","Microsoft JhengHei","PingFang HK",sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}

/* ─── Header ─── */
.site-header {
  background: linear-gradient(135deg, #f5efe6 0%, #fdf2f3 50%, #e8d5f5 100%);
  padding: 32px 20px 20px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(232,224,216,0.5);
}
.site-header h1 {
  font-size: 1.4em;
  font-weight: 700;
  color: #4a3f3a;
  letter-spacing: 0.03em;
}
.site-header .tagline {
  font-size: 0.78em;
  color: var(--sub);
  margin-top: 4px;
}
.header-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 10px;
}
.header-badges span {
  font-size: 0.7em;
  background: rgba(255,255,255,0.75);
  padding: 3px 12px;
  border-radius: 20px;
  color: #6b5a3e;
}

/* ─── Progress Bar ─── */
.progress-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 16px 20px 8px;
  background: var(--bg);
}
.progress-step {
  display: flex;
  align-items: center;
  gap: 0;
}
.step-circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8em;
  font-weight: 600;
  background: #f0ece8;
  color: var(--sub);
  transition: all 0.3s;
  flex-shrink: 0;
}
.step-circle.active {
  background: var(--rose);
  color: #fff;
  box-shadow: 0 2px 8px rgba(212,148,138,0.4);
}
.step-circle.done {
  background: var(--green);
  color: #fff;
}
.step-line {
  width: 40px;
  height: 2px;
  background: #f0ece8;
  margin: 0 4px;
  transition: background 0.3s;
}
.step-line.done { background: var(--green); }
.step-label {
  font-size: 0.65em;
  color: var(--sub);
  text-align: center;
  margin-top: 4px;
  white-space: nowrap;
}
.step-label.active { color: var(--rose); font-weight: 600; }
.step-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ─── Main Container ─── */
.main { max-width: 480px; margin: 0 auto; padding: 0 16px 100px; }

/* ─── Step Panels ─── */
.step-panel { display: none; animation: fadeUp 0.35s ease; }
.step-panel.active { display: block; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to { opacity:1; transform:translateY(0); }
}

/* ─── Section Titles ─── */
.section-title {
  font-size: 1.1em;
  font-weight: 700;
  color: #4a3f3a;
  margin: 20px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── Branch Cards ─── */
.branch-card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.branch-card:hover { border-color: var(--rose); transform: translateY(-1px); box-shadow: var(--shadow); }
.branch-card.selected { border-color: var(--rose); background: var(--rose-light); }
.branch-card .branch-name {
  font-size: 1.1em;
  font-weight: 700;
  color: #4a3f3a;
  margin-bottom: 6px;
}
.branch-card .branch-info {
  font-size: 0.8em;
  color: var(--sub);
  line-height: 1.7;
}
.branch-card .branch-tag {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 0.65em;
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.branch-card .branch-tag.popular {
  background: var(--rose-light);
  color: var(--rose-dark);
}
.branch-card .branch-tag.new {
  background: var(--blue-light);
  color: var(--blue);
}
.branch-card .check-mark {
  position: absolute;
  top: 12px;
  left: 12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--rose);
  color: #fff;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 0.7em;
}
.branch-card.selected .check-mark { display: flex; }

/* ─── Category Tabs ─── */
.cat-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
  font-size: 0.78em;
  font-family: inherit;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--sub);
}
.cat-tab:hover { border-color: var(--gold); }
.cat-tab.active { background: var(--rose); color: #fff; border-color: var(--rose); }

/* ─── Service Cards ─── */
.service-list { margin-top: 8px; }
.service-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.service-card:hover { border-color: var(--rose); }
.service-card.selected { border-color: var(--rose); background: var(--rose-light); }
.service-card .svc-left { flex: 1; }
.service-card .svc-name {
  font-size: 0.88em;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}
.service-card .svc-tag {
  font-size: 0.62em;
  padding: 1px 8px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 600;
  vertical-align: middle;
}
.svc-tag.hot { background: #fff3cd; color: #856404; }
.svc-tag.new { background: #ffe0e0; color: #c0392b; }
.svc-tag.crown { background: #e8d5f5; color: #6c3483; }
.service-card .svc-right {
  text-align: right;
  flex-shrink: 0;
}
.service-card .svc-price {
  font-size: 1em;
  font-weight: 700;
  color: var(--rose);
}
.service-card .svc-orig {
  font-size: 0.7em;
  color: #bbb;
  text-decoration: line-through;
}
.service-card .svc-dur {
  font-size: 0.68em;
  color: var(--sub);
  margin-top: 2px;
}
.service-card .svc-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 2px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65em;
  flex-shrink: 0;
  transition: all 0.2s;
}
.service-card.selected .svc-check {
  background: var(--rose);
  border-color: var(--rose);
  color: #fff;
}

/* ─── Promo Banner ─── */
.promo-card {
  background: linear-gradient(135deg, #fdf2f3, #faf6ef);
  border: 2px dashed var(--rose);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.promo-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.promo-card.selected { border-style: solid; background: var(--rose-light); }
.promo-card .promo-badge {
  display: inline-block;
  background: var(--rose);
  color: #fff;
  font-size: 0.7em;
  padding: 3px 14px;
  border-radius: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.promo-card .promo-name { font-size: 1.1em; font-weight: 700; color: #4a3f3a; }
.promo-card .promo-price { font-size: 2em; font-weight: 800; color: var(--rose); margin: 6px 0 2px; }
.promo-card .promo-orig { font-size: 0.5em; color: #999; text-decoration: line-through; font-weight: 400; margin-left: 4px; }
.promo-card .promo-desc { font-size: 0.8em; color: var(--sub); }

/* ─── Date Picker ─── */
.date-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.date-grid .day-label {
  text-align: center;
  font-size: 0.65em;
  color: var(--sub);
  padding: 4px 0;
}
.date-cell {
  text-align: center;
  padding: 8px 2px;
  border-radius: 10px;
  font-size: 0.82em;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
}
.date-cell:hover { background: var(--rose-light); }
.date-cell.today { font-weight: 700; color: var(--rose); }
.date-cell.selected { background: var(--rose); color: #fff; font-weight: 600; }
.date-cell.disabled { color: #ddd; cursor: not-allowed; }
.date-cell.empty { cursor: default; }

/* ─── Time Slots ─── */
.time-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.time-slot {
  text-align: center;
  padding: 10px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  cursor: pointer;
  font-size: 0.85em;
  font-family: inherit;
  background: #fff;
  transition: all 0.15s;
  color: var(--text);
}
.time-slot:hover { border-color: var(--rose); }
.time-slot.selected { background: var(--rose); color: #fff; border-color: var(--rose); }
.time-slot.disabled { color: #ccc; cursor: not-allowed; background: #fafafa; }

/* ─── Form ─── */
.form-group {
  margin-bottom: 14px;
}
.form-group label {
  display: block;
  font-size: 0.8em;
  font-weight: 600;
  color: var(--sub);
  margin-bottom: 4px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 0.9em;
  font-family: inherit;
  background: #fff;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--rose);
}
.form-group textarea { resize: vertical; min-height: 60px; }

/* ─── Summary ─── */
.summary-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  overflow: hidden;
  margin-bottom: 16px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 16px;
  font-size: 0.85em;
  border-bottom: 1px solid #f5f0ec;
}
.summary-row:last-child { border-bottom: none; }
.summary-row .label { color: var(--sub); }
.summary-row .value { font-weight: 600; color: var(--text); text-align: right; max-width: 60%; }
.summary-row.highlight .value { color: var(--rose); font-size: 1.1em; }

/* ─── Buttons ─── */
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 1em;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}
.btn-primary.rose {
  background: var(--rose);
  color: #fff;
}
.btn-primary.rose:hover { background: var(--rose-dark); }
.btn-primary.green {
  background: #25D366;
  color: #fff;
}
.btn-primary.green:hover { background: #1fa855; }
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  font-size: 0.82em;
  font-family: inherit;
  cursor: pointer;
  color: var(--sub);
  margin-bottom: 16px;
  transition: all 0.2s;
}
.btn-back:hover { border-color: var(--rose); color: var(--text); }

/* ─── Footer ─── */
.site-footer {
  text-align: center;
  padding: 20px;
  font-size: 0.72em;
  color: #bbb;
}

/* ─── Floating CTA ─── */
.floating-cta {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: rgba(253,250,246,0.95);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  z-index: 100;
}
.floating-cta .btn-primary { max-width: 480px; margin: 0 auto; }

/* ─── Month Nav ─── */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}
.month-nav .month-label {
  font-weight: 600;
  font-size: 0.95em;
  color: #4a3f3a;
}
.month-nav button {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 0.85em;
  font-family: inherit;
  color: var(--text);
  transition: all 0.2s;
}
.month-nav button:hover { border-color: var(--rose); }

/* ─── Confirmation Screen ─── */
.confirm-hero {
  text-align: center;
  padding: 32px 20px;
}
.confirm-hero .check-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8em;
  margin-bottom: 12px;
}
.confirm-hero h2 {
  font-size: 1.2em;
  color: #4a3f3a;
  margin-bottom: 4px;
}
.confirm-hero p {
  font-size: 0.85em;
  color: var(--sub);
}

/* ─── Responsive ─── */
@media (min-width: 481px) {
  .main { padding: 0 24px 100px; }
  .site-header { padding: 24px 20px 16px; }
}
</style>

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzS0PATza6lS9m_UWNAKU82FspPTN00IzXlbUg58NrA_B5ouNy12mCAveKQerc0PZlxgA/exec'; // ★ GAS Web App URL（即時讀 Google Calendar）
const SCHEDULE_JSON = 'schedule.json'; // 倉庫內 fallback cache（同 booking.html 同一層）
let busyData = {};        // { "YYYY-MM-DD": [[startMin, endMin, branchKey], ...] }
let calSyncStatus = 'idle'; // idle | cached | syncing | synced | error

function getTravelBuffer(selBr, busyBr) {
  if (!selBr || !busyBr) return 60;
  if (selBr === busyBr) return 0;
  var hasTM = (selBr === 'tm' || busyBr === 'tm');
  return hasTM ? 60 : 30;
}
function detectBranch(summary, location) {
  var text = (summary || '') + ' ' + (location || '');
  if (/屯門|tuen/i.test(text)) return 'tm';
  if (/荔枝角|lai\s*chi/i.test(text)) return 'lck';
  if (/太子|prince/i.test(text)) return 'pe';
  return '';
}
function isSlotBusy(slotDate, slotH, slotM, durMin) {
  if (!busyData) return false;
  var ds = slotDate.getFullYear() + '-' + String(slotDate.getMonth()+1).padStart(2,'0') + '-' + String(slotDate.getDate()).padStart(2,'0');
  var slots = busyData[ds];
  if (!slots) return false;
  var sMin = slotH*60 + slotM, eMin = sMin + durMin;
  var selBr = state.branch;
  for (var i = 0; i < slots.length; i++) {
    var bs0 = slots[i][0], be0 = slots[i][1];
    var bBr = slots[i][2] || '';
    var isPriv = slots[i][3]; // 私人行程（紅色 Yuki Lam 日曆）→ 已自包通勤，唔加 travel buffer
    var buf = isPriv ? 0 : getTravelBuffer(selBr, bBr);
    var bs = bs0 - buf; if (bs < 0) bs = 0;
    var be = be0 + buf; if (be > 1440) be = 1440;
    if (sMin < be && eMin > bs) return true;
  }
  return false;
}
function renderSyncBadge() {
  var el = document.getElementById('syncBadge');
  if (!el) return;
  if (calSyncStatus === 'syncing') el.innerHTML = '⏳ 同步日曆中…';
  else if (calSyncStatus === 'synced') el.innerHTML = '✅ 即時同步 Google 日曆';
  else if (calSyncStatus === 'cached') el.innerHTML = '📅 已載入日曆（快取）';
  else if (calSyncStatus === 'error') el.innerHTML = '⚠️ 日曆同步失敗（用預載）';
  el.style.cssText = 'font-size:0.72em;color:#8a7d75;margin:2px 0 12px;text-align:right;';
}
function loadFallback() {
  fetch(SCHEDULE_JSON + '?t=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if (d && d.busy) {
        busyData = d.busy;
        if (calSyncStatus !== 'synced') { calSyncStatus = 'cached'; renderSyncBadge(); if (state.step === 3 && state.date) renderStep3(); }
      }
    })
    .catch(function(e){ console.log('schedule.json load failed:', e); });
}
function fetchGASCAL() {
  if (!GAS_URL) return; // 未設定 live source → 用 fallback
  fetch(GAS_URL + (GAS_URL.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if (d && d.busy && Object.keys(d.busy).length) {
        busyData = d.busy; calSyncStatus = 'synced'; renderSyncBadge();
        if (state.step === 3 && state.date) renderStep3();
      } else { throw new Error('empty busy'); }
    })
    .catch(function(e){
      console.log('GAS fetch failed:', e);
      calSyncStatus = (busyData && Object.keys(busyData).length) ? 'cached' : 'error';
      renderSyncBadge();
      if (state.step === 3 && state.date) renderStep3();
    });
}
function initCalSync() {
  if (calSyncStatus === 'syncing' || calSyncStatus === 'synced') return;
  loadFallback();
  calSyncStatus = 'syncing'; renderSyncBadge();
  fetchGASCAL();
  setTimeout(function() {
    if (calSyncStatus === 'syncing') {
      calSyncStatus = (busyData && Object.keys(busyData).length) ? 'cached' : 'error';
      renderSyncBadge();
      if (state.step === 3 && state.date) renderStep3();
    }
  }, 8000);
}

function renderCalendar() {
  const year = state.currentYear;
  const month = state.currentMonth;
  const today = new Date();
  today.setHours(0,0,0,0);
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = firstDay.getDay(); // 0=Sun
  const daysInMonth = lastDay.getDate();

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayLabels = ['日','一','二','三','四','五','六'];

  let cells = '';
  // Day labels
  dayLabels.forEach(d => { cells += `<div class="day-label">${d}</div>`; });
  // Empty cells before first day
  for (let i = 0; i < startDow; i++) { cells += '<div class="date-cell empty"></div>'; }
  // Days
  for (let d = 1; d <= daysInMonth; d++) {
    const thisDate = new Date(year, month, d);
    thisDate.setHours(0,0,0,0);
    const dow = thisDate.getDay();
    const isPast = thisDate < today;
    const isToday = thisDate.getTime() === today.getTime();
    const isSelected = state.date && state.date.getTime() === thisDate.getTime();
    const cls = [
      'date-cell',
      isPast ? 'disabled' : '',
      isToday ? 'today' : '',
      isSelected ? 'selected' : ''
    ].filter(Boolean).join(' ');
    cells += `<div class="${cls}" ${!isPast ? `onclick="selectDate(${year},${month},${d})"` : ''}>${d}</div>`;
  }

  const prevMonth = month === 0 ? 11 : month - 1;
  const prevYear = month === 0 ? year - 1 : year;
  const canPrev = new Date(prevYear, prevMonth + 1, 0) >= today;

  return `
    <div class="month-nav">
      <button ${canPrev ? 'onclick="changeMonth(-1)"' : 'disabled style="opacity:0.3;cursor:not-allowed;"'}>◀</button>
      <span class="month-label">${year}年 ${monthNames[month]}</span>
      <button onclick="changeMonth(1)">▶</button>
    </div>
    <div class="date-grid">${cells}</div>
  `;
}

function renderTimeSlots() {
  const date = state.date;
  const dow = date.getDay();
  const slots = OP_HOURS[dow] || [];
  const now = new Date();
  const isToday = date.toDateString() === now.toDateString();

  let timeOptions = [];
  slots.forEach(range => {
    for (let h = range.s; h < range.e; h++) {
      for (let m = 0; m < 60; m += 30) {
        const tStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        if (isToday) {
          const slotTime = new Date(date);
          slotTime.setHours(h, m, 0, 0);
          if (slotTime <= new Date(now.getTime() + 60*60*1000)) continue; // skip past & <1hr ahead
        }
        const busy = isSlotBusy(date, h, m, 60);
        timeOptions.push({ t: tStr, busy: busy });
      }
    }
  });

  if (timeOptions.length === 0) {
    return '<p style="font-size:0.85em;color:var(--sub);text-align:center;padding:16px;">今日已無可用時段，請選擇其他日期</p>';
  }

  return `<div class="time-grid">${timeOptions.map(o => `
    <div class="time-slot ${state.time === o.t ? 'selected' : ''} ${o.busy ? 'disabled' : ''}" ${o.busy ? '' : `onclick="selectTime('${o.t}')"`}>${o.t}</div>
  `).join('')}</div>`;
}

      </div>
      <button class="btn-primary green" onclick="confirmBooking()">📲 WhatsApp 確認預約</button>
      <p style="text-align:center;font-size:0.75em;color:var(--sub);margin-top:12px;">按鈕會打開 WhatsApp 並自動填入預約資訊</p>
    </div>
  `;
}

function renderFloatingCTA() {
  const cta = document.getElementById('floatingCTA');
  if (state.step === 1 && state.branch) {
    cta.style.display = 'block';
    cta.innerHTML = `<button class="btn-primary rose" onclick="goStep(2)">下一步 → 選擇療程</button>`;
  } else if (state.step === 2 && state.service) {
    cta.style.display = 'block';
    cta.innerHTML = `<button class="btn-primary rose" onclick="goStep(3)">下一步 → 揀時間</button>`;
  } else if (state.step === 3 && state.date && state.time && state.name && state.phone) {
    cta.style.display = 'block';
    cta.innerHTML = `<button class="btn-primary rose" onclick="goStep(4)">確認預約 →</button>`;
  } else {
    cta.style.display = 'none';
  }
}

// ═══════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════

function selectBranch(id) {
  state.branch = id;
  state.service = null;
  state._activeCat = 'promo';
  render();
}

function switchCat(catId) {
  state._activeCat = catId;
  render();
}

function selectService(id) {
  // Find service across all categories
  for (const cat of CATEGORIES) {
    const item = cat.items.find(i => i.id === id);
    if (item) { state.service = item; break; }
  }
  render();
}

function selectDate(y, m, d) {
  state.date = new Date(y, m, d);
  state.date.setHours(0,0,0,0);
  state.time = null;
  render();
}

function selectTime(t) {
  state.time = t;
  render();
}

function changeMonth(dir) {
  state.currentMonth += dir;
  if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
  if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
  render();
}

function goStep(n) {
  state.step = n;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function confirmBooking() {
  const branchName = BRANCHES.find(b => b.id === state.branch)?.name || '';
  const isTM = state.branch === 'tm';
  const svc = state.service;
  const price = svc ? (isTM ? (svc.tmTrial || svc.tmPrice) : (svc.otherTrial || svc.otherPrice)) : 0;
  const hasTrial = isTM ? !!svc.tmTrial : !!svc.otherTrial;
  const dateStr = state.date ? `${state.date.getFullYear()}/${state.date.getMonth()+1}/${state.date.getDate()} (${['日','一','二','三','四','五','六'][state.date.getDay()]})` : '';
  
  const msg = `🌟 StarLight Beauty 預約

📍 分店：${branchName}
💆 療程：${svc?.name}
💰 ${hasTrial ? '體驗價' : '價格'}：$${price}
📅 日期：${dateStr}
⏰ 時間：${state.time}

👤 姓名：${state.name}
📱 電話：${state.phone}
${state.notes ? `📝 備註：${state.notes}` : ''}

由線上預約系統提交 ✨`;

  const encoded = encodeURIComponent(msg);
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`;
  window.open(url, '_blank');

  // Show confirmation screen
  const main = document.getElementById('mainContent');
  document.getElementById('floatingCTA').style.display = 'none';
  document.getElementById('progressBar').innerHTML = '';
  main.innerHTML = `
    <div class="confirm-hero">
      <div class="check-circle">✓</div>
      <h2>預約資訊已發送！</h2>
      <p>WhatsApp 已打開，發送訊息即可完成預約</p>
    </div>
    <div class="summary-card">
      <div class="summary-row"><span class="label">分店</span><span class="value">${branchName}</span></div>
      <div class="summary-row"><span class="label">療程</span><span class="value">${svc?.name}</span></div>
      <div class="summary-row"><span class="label">日期</span><span class="value">${dateStr}</span></div>
      <div class="summary-row"><span class="label">時間</span><span class="value">${state.time}</span></div>
    </div>
    <p style="text-align:center;font-size:0.8em;color:var(--sub);margin-top:12px;">店主會盡快 WhatsApp 回覆確認 🤍</p>
    <button class="btn-primary rose" style="margin-top:16px;" onclick="resetBooking()">重新預約</button>
  `;
}

function resetBooking() {
  state = {
    step: 1,
    branch: null,
    service: null,
    date: null,
    time: null,
    name: '',
    phone: '',
    notes: '',
    currentMonth: new Date().getMonth(),
    currentYear: new Date().getFullYear()
  };
  render();
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
render();
initCalSync();
</script>

</body>
</html>
