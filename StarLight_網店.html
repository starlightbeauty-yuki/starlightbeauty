<html lang="zh-HK">

<title>StarLight Beauty · 精選產品網店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a96e;
  --gold-light: #f5ecd7;
  --rose: #b76e79;
  --rose-light: #f8e1e4;
  --pink: #f8d7da;
  --pink-deep: #e89aa5;
  --bg: #fdfaf5;
  --text: #3d3226;
  --sub: #8c7b6b;
  --card: #fff;
  --shadow: 0 4px 24px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 32px rgba(183,110,121,0.15);
  --green: #25D366;
  --green-dark: #1da851;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 40px 20px 24px;
  background: linear-gradient(135deg, #f5efe6 0%, #fdf2f3 50%, #f8e1e4 100%);
  width: 100%;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 30px;
  background: var(--bg);
  border-radius: 50% 50% 0 0;
}
.brand {
  font-size: 2em;
  font-family: 'Alex Brush', cursive;
  letter-spacing: 0.06em;
  color: var(--rose);
}
.brand span { color: var(--gold); }
.tagline {
  font-size: 0.82em;
  color: var(--sub);
  margin-top: 4px;
  letter-spacing: 0.04em;
}
.shop-title {
  font-size: 1.15em;
  color: var(--rose);
  margin-top: 12px;
  font-weight: 700;
}
.shop-desc {
  font-size: 0.78em;
  color: var(--sub);
  margin-top: 6px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.6;
}

/* ===== Category Tabs ===== */
.tabs-wrap {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 20px 16px 12px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}
.tab {
  padding: 10px 20px;
  border-radius: 24px;
  border: 2px solid var(--rose-light);
  background: #fff;
  color: var(--rose);
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab.active {
  background: var(--rose);
  color: #fff;
  border-color: var(--rose);
  box-shadow: 0 4px 12px rgba(183,110,121,0.3);
}
.tab .badge-count {
  background: var(--pink-light);
  color: var(--rose);
  font-size: 0.75em;
  padding: 1px 7px;
  border-radius: 10px;
  font-weight: 700;
}
.tab.active .badge-count {
  background: rgba(255,255,255,0.3);
  color: #fff;
}

/* ===== Product Grid ===== */
.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 520px;
  margin: 0 auto;
  padding: 8px 16px 100px;
}
@media (min-width: 480px) {
  .products { gap: 16px; }
}

/* ===== Product Card ===== */
.card {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  position: relative;
}
.card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.card-img {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #fdf2f3, #f8e1e4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5em;
  position: relative;
  overflow: hidden;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-img .placeholder {
  font-size: 2.8em;
  opacity: 0.5;
}
.tag-label {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 0.65em;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  color: #fff;
  z-index: 2;
}
.tag-group { background: #e74c3c; }
.tag-stock { background: #27ae60; }
.tag-preorder { background: #f39c12; }
.tag-limited {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 0.6em;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 8px;
  z-index: 2;
}
.card-body {
  padding: 10px 12px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-name {
  font-size: 0.88em;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 0.7em;
  color: var(--sub);
  line-height: 1.5;
  margin-bottom: 8px;
  flex: 1;
}
.card-price {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 10px;
}
.price-now {
  font-size: 1.15em;
  font-weight: 700;
  color: var(--rose);
}
.price-orig {
  font-size: 0.7em;
  color: var(--sub);
  text-decoration: line-through;
}
.card-actions {
  display: flex;
  gap: 6px;
}
.btn-wa {
  flex: 1;
  background: var(--green);
  color: #fff;
  border: none;
  padding: 8px 6px;
  border-radius: 10px;
  font-size: 0.72em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-family: inherit;
}
.btn-wa:hover {
  background: var(--green-dark);
  transform: scale(1.03);
}
.btn-wa:active { transform: scale(0.98); }
.btn-pay {
  background: var(--rose);
  color: #fff;
  border: none;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 0.72em;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: inherit;
}
.btn-pay:hover {
  background: #a55e68;
  transform: scale(1.03);
}
.btn-pay:active { transform: scale(0.98); }
.btn-pay.disabled {
  background: #ddd;
  color: #aaa;
  cursor: not-allowed;
  transform: none;
}

/* ===== Group Buy Banner ===== */
.group-buy-banner {
  background: linear-gradient(135deg, #fff5f5, #ffe8e8);
  border: 1.5px dashed #e89aa5;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 0 16px 14px;
  max-width: 488px;
  margin-left: auto;
  margin-right: auto;
  font-size: 0.75em;
  color: #c0392b;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: pulse-border 2s infinite;
}
@keyframes pulse-border {
  0%, 100% { border-color: #e89aa5; }
  50% { border-color: #e74c3c; }
}
.group-buy-banner .icon { font-size: 1.3em; }

/* ===== Countdown ===== */
.countdown {
  font-size: 0.65em;
  color: #e74c3c;
  font-weight: 700;
  margin-top: 4px;
}

/* ===== Floating WhatsApp ===== */
.float-wa {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 56px;
  height: 56px;
  background: var(--green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  color: #fff;
  text-decoration: none;
  box-shadow: 0 4px 16px rgba(37,211,102,0.4);
  z-index: 100;
  transition: all 0.3s ease;
  animation: bounce 2s infinite;
}
.float-wa:hover { transform: scale(1.1); }
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 24px 20px 40px;
  font-size: 0.72em;
  color: var(--sub);
  line-height: 1.8;
  border-top: 1px solid var(--rose-light);
  margin-top: 20px;
}
.footer a {
  color: var(--rose);
  text-decoration: none;
}
.footer .store-info {
  margin-bottom: 12px;
  font-weight: 600;
  color: var(--text);
}

/* ===== Cart Toast ===== */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: #fff;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 0.8em;
  font-weight: 600;
  z-index: 200;
  transition: transform 0.3s ease;
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ===== Empty State ===== */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--sub);
  font-size: 0.9em;
}
.empty .icon { font-size: 2.5em; margin-bottom: 12px; }

/* ===== Quantity Selector ===== */
.qty-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}
.qty-btn {
  width: 26px;
  height: 26px;
  border: 1.5px solid var(--rose-light);
  background: #fff;
  color: var(--rose);
  border-radius: 8px;
  font-size: 0.85em;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}
.qty-btn:hover { background: var(--rose-light); }
.qty-num {
  font-size: 0.8em;
  font-weight: 700;
  color: var(--text);
  min-width: 24px;
  text-align: center;
}

/* ===== Back to Top ===== */
.back-top {
  position: fixed;
  bottom: 20px;
  left: 20px;
  width: 44px;
  height: 44px;
  background: var(--rose);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
  cursor: pointer;
  z-index: 99;
  opacity: 0;
  transition: opacity 0.3s ease;
  border: none;
}
.back-top.show { opacity: 1; }
</style>
</head>

<script>
// ===== Product Data =====
// 小主更新產品時，直接改呢度就得
const WA_NUMBER = '85262707867'; // WhatsApp 號碼

const products = [
  // ===== 團購專區 =====
  {

  {

    price: 150,

  },
  {

  },

];

// ===== Render Products =====
let currentCat = 'all';
let cart = {};

function getTagClass(cat) {
  return { group: 'tag-group', stock: 'tag-stock', preorder: 'tag-preorder' }[cat] || '';
}

function getCatLabel(cat) {
  return { group: '🔥 團購', stock: '📦 現貨', preorder: '📋 預訂' }[cat] || '';
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  const filtered = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);

  if (filtered.length === 0) {
    grid.innerHTML = '';
    document.getElementById('emptyState').style.display = 'block';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';

  grid.innerHTML = filtered.map(p => {
    const imgHtml = p.img
      ? `<img src="${p.img}" alt="${p.name}">`
      : `<span class="placeholder">${p.emoji}</span>`;

    const origHtml = p.original > 0
      ? `<span class="price-orig">$${p.original}</span>`
      : '';

    const limitedHtml = p.limited
      ? `<div class="tag-limited">${p.limited}</div>`
      : '';

    const payBtn = p.payLink
      ? `<button class="btn-pay" onclick="window.open('${p.payLink}')">線上付款</button>`
      : `<button class="btn-pay disabled" onclick="showToast('線上付款即將開通')">付款</button>`;

    return `
      <div class="card">
        <div class="card-img">
          <span class="tag-label ${getTagClass(p.cat)}">${p.tag}</span>
          ${limitedHtml}
          ${imgHtml}
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.desc}</div>
          <div class="card-price">
            <span class="price-now">$${p.price}</span>
            ${origHtml}
          </div>
          <div class="qty-wrap">
            <button class="qty-btn" onclick="changeQty('${p.id}',-1)">−</button>
            <span class="qty-num" id="qty-${p.id}">1</span>
            <button class="qty-btn" onclick="changeQty('${p.id}',1)">+</button>
          </div>
          <div class="card-actions">
            <button class="btn-wa" onclick="orderWhatsApp('${p.id}')">
              💬 WhatsApp 落單
            </button>
            ${payBtn}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== Quantity =====
function changeQty(id, delta) {
  const el = document.getElementById('qty-' + id);
  let qty = parseInt(el.textContent) || 1;
  qty = Math.max(1, Math.min(99, qty + delta));
  el.textContent = qty;
}

// ===== WhatsApp Order =====
function orderWhatsApp(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const qty = parseInt(document.getElementById('qty-' + id).textContent) || 1;
  const total = p.price * qty;

  let msg = `*StarLight Beauty 產品訂單*\n\n`;
  msg += `📦 產品：${p.name}\n`;
  msg += `🏷️ 類別：${getCatLabel(p.cat)}\n`;
  msg += `💰 單價：$${p.price}\n`;
  if (p.original > 0) msg += `(原價 $${p.original})\n`;
  msg += `🔢 數量：${qty}\n`;
  msg += `*💵 總計：$${total}*\n\n`;
  msg += `--- 客戶資料 ---\n`;
  msg += `姓名：\n`;
  msg += `電話：\n`;
  msg += `取貨方式：□ 門店自取 / □ 順豐到付\n`;
  if (p.cat === 'preorder') {
    msg += `\n⚠️ 預訂產品需時採購，預計到貨後另行通知\n`;
  }
  if (p.cat === 'group') {
    msg += `\n⏰ 團購截單：${p.deadline}\n`;
  }
  msg += `\n備註：\n`;

  const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  showToast('已跳轉到 WhatsApp 落單 💬');
}

// ===== Filter =====
function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  renderProducts();
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== Count Badges =====
function updateCounts() {
  document.getElementById('count-all').textContent = products.length;
  document.getElementById('count-group').textContent = products.filter(p => p.cat === 'group').length;
  document.getElementById('count-stock').textContent = products.filter(p => p.cat === 'stock').length;
  document.getElementById('count-preorder').textContent = products.filter(p => p.cat === 'preorder').length;
}

// ===== Group Buy Countdown =====
function updateCountdown() {
  const groupProducts = products.filter(p => p.cat === 'group' && p.deadline);
  if (groupProducts.length === 0) {
    document.getElementById('groupBanner').style.display = 'none';
    return;
  }
  const earliest = groupProducts.reduce((a, b) => a.deadline < b.deadline ? a : b);
  const deadline = new Date(earliest.deadline + 'T23:59:59+08:00');
  const now = new Date();
  const diff = deadline - now;

  if (diff <= 0) {
    document.getElementById('groupBanner').style.display = 'none';
    return;
  }

  document.getElementById('groupBanner').style.display = 'flex';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  document.getElementById('groupCountdown').textContent =
    `截單倒數：${days}日 ${hours}小時 ${mins}分鐘`;
}

// ===== Back to Top =====
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backTop');
  btn.classList.toggle('show', window.scrollY > 300);
});
function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== Init =====
updateCounts();
renderProducts();
updateCountdown();
setInterval(updateCountdown, 60000);
</script>
</body>
</html>
