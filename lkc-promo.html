    font-weight: 600;

  /* Gallery */

    padding: 30px 16px 60px;
  }
  .gallery-title {

    font-size: 1.4em;

    margin-bottom: 8px;
  }
  .gallery-subtitle {
    text-align: center;
    font-size: 0.85em;
    color: var(--sub);
    margin-bottom: 28px;
  }
  /* 用 column 排版（瀑布流）：海報有 4:5 同 1:1 兩種比例，
     唔可以用 grid + 固定 aspect-ratio，否則 4:5 海報會被切走上下文字 */
  .promo-grid {
    column-count: 2;
    column-gap: 14px;
  }
  .promo-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.04);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    display: block;
    margin: 0 0 14px 0;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
  }
  .promo-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  .promo-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Footer */

    padding: 30px 20px 40px;
    font-size: 0.72em;
    color: #bfb8a8;
    background: var(--card);
    margin-top: 40px;
  }
  .footer a { color: var(--blue); text-decoration: none; }

  @media (max-width: 500px) {
    .promo-grid { column-count: 1; }
  }
</style>
