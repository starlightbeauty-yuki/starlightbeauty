  .brand span { color: var(--gold); }
  .tagline { font-size: 0.82em; color: var(--sub); margin-top: 4px; }
  .subtitle { font-size: 0.85em; color: var(--blue); margin-top: 6px; font-weight: 600; }
  .store-badge {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    font-size: 0.75em;
    padding: 4px 16px;
    border-radius: 20px;
    margin-top: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Back button */
  .back-link {
    display: inline-block;
    margin: 20px auto 0;
    padding: 10px 24px;
    background: var(--card);
    border: 1px solid var(--blue);
    border-radius: 24px;
    color: var(--blue);
    text-decoration: none;
    font-size: 0.85em;
    font-weight: 600;
    transition: all 0.2s;
  }
  .back-link:hover { background: var(--blue); color: #fff; }

  /* Gallery */
  .gallery-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 16px 60px;
  }
  .gallery-title {
    text-align: center;
    font-size: 1.4em;
    color: var(--text);
    margin-bottom: 8px;
  }
  .gallery-subtitle {
    text-align: center;
    font-size: 0.85em;
    color: var(--sub);
    margin-bottom: 28px;
  }
  .promo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  .promo-card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid rgba(0,0,0,0.04);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .promo-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  .promo-card img {
    width: 100%;
    height: auto;
    display: block;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 30px 20px 40px;
    font-size: 0.72em;
    color: #bfb8a8;
    background: var(--card);
    margin-top: 40px;
  }
  .footer a { color: var(--blue); text-decoration: none; }

  @media (max-width: 500px) {
    .promo-grid { grid-template-columns: 1fr; }
